[project]
name = "talemotion-backend"
version = "0.1.0"
description = "FastAPI foundation for the TaleMotion media pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "boto3>=1.35,<2",
    "celery[redis]>=5.4,<6",
    "fastapi[standard]>=0.115,<1.0",
    "genblaze-core>=0.3.1,<0.4",
    "genblaze-openai>=0.3.1,<0.4",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
