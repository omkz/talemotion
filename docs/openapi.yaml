      properties:
        genblaze_mode: { const: mock }
        backblaze_mode: { const: mock }
        b2_bucket_name: { type: string }
        b2_region: { type: string }
    SettingsResponse:
      type: object
      required: [general, generation, integrations, updated_at]
      properties:
        general: { $ref: "#/components/schemas/SettingsGeneral" }
        generation: { $ref: "#/components/schemas/SettingsGeneration" }
