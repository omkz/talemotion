        preferred_video_provider: { type: string }
        preferred_voice_provider: { type: string }
        auto_retry_failed_generations: { type: boolean }
        maximum_automatic_retries: { type: integer, minimum: 0, maximum: 5 }
    SettingsIntegrations:
      type: object
