openapi: 3.1.0
info:
  title: TaleMotion Backend Foundation API
  version: 0.1.0
  description: PostgreSQL-backed project, scene, and job foundation.
servers:
  - url: http://localhost:8000/api/v1
security:
  - cookieAuth: []
paths:
  /health:
    get:
      security: []
      tags: [Health]
      summary: Get API process health
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthResponse"}
  /health/dependencies:
    get:
      security: []
      tags: [Health]
      summary: Check PostgreSQL and Redis
      responses:
        "200":
          description: Required dependencies are available
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DependencyHealthResponse"}
        "503":
          description: A required dependency is unavailable
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
  /auth/register:
    post:
      security: []
      tags: [Authentication]
      summary: Register a user and establish a cookie session
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterRequest"}
      responses:
        "201":
          description: Registered user; session and CSRF cookies are set
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserResponse"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /auth/login:
    post:
      security: []
      tags: [Authentication]
      summary: Establish a cookie session
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: Authenticated user; session and CSRF cookies are set
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserResponse"}
        "401": {$ref: "#/components/responses/Error"}
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current session
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "204": {description: Session revoked and cookies cleared}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserResponse"}
        "401": {$ref: "#/components/responses/Error"}
  /auth/csrf:
    get:
      tags: [Authentication]
      summary: Rotate the current session's CSRF token
      responses:
        "200":
          description: New readable CSRF token; its cookie is also refreshed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CsrfTokenResponse"}
        "401": {$ref: "#/components/responses/Error"}
  /credits:
    get:
      tags: [Credits]
      summary: Get the current user's internal credit balance
      responses:
        "200":
          description: Decimal-safe balance and configured operation rates
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreditBalanceResponse"}
        "401": {$ref: "#/components/responses/Error"}
  /credits/transactions:
    get:
      tags: [Credits]
      summary: List the current user's credit ledger
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200":
          description: Recent immutable transactions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreditTransactionListResponse"}
        "401": {$ref: "#/components/responses/Error"}
  /usage:
    get:
      tags: [Credits]
      summary: List the current user's provider usage
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200":
          description: Recent billable provider operations
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UsageRecordListResponse"}
        "401": {$ref: "#/components/responses/Error"}
  /projects:
    get:
      tags: [Projects]
      summary: List projects
      parameters:
        - {name: status, in: query, schema: {$ref: "#/components/schemas/ProjectStatus"}}
        - {name: mode, in: query, schema: {$ref: "#/components/schemas/VideoMode"}}
        - {name: search, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, schema: {type: [string, "null"]}}
      responses:
        "200":
          description: Cursor page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectListResponse"}
        "400": {$ref: "#/components/responses/Error"}
    post:
      tags: [Projects]
      summary: Create a project and default Main chapter
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateProjectRequest"}
      responses:
        "201":
          description: Persisted project
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectResponse"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /projects/{project_id}:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
    get:
      tags: [Projects]
      summary: Get project with chapters and scenes
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectResponse"}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      tags: [Projects]
      summary: Update safe user-controlled fields
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateProjectRequest"}
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectResponse"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Projects]
      summary: Soft-delete a project
      responses:
        "204": {description: Project soft-deleted}
        "404": {$ref: "#/components/responses/Error"}
  /projects/{project_id}/storyboard:
    post:
      tags: [Projects]
      summary: Queue a four-scene historical storyboard
      parameters:
        - {$ref: "#/components/parameters/ProjectId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateStoryboardRequest"}
      responses:
        "202":
          description: Persisted queued storyboard job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenerationJobResponse"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /projects/{project_id}/generations:
    post:
      tags: [Projects]
      summary: Queue media generation for all four storyboard scenes
      parameters:
        - {$ref: "#/components/parameters/ProjectId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateProjectGenerationRequest"}
      responses:
        "202":
          description: Parent job with four queued child summaries
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenerationJobResponse"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /projects/{project_id}/renders:
    get:
      tags: [Renders]
      summary: List project render versions
      parameters:
        - {$ref: "#/components/parameters/ProjectId"}
      responses:
        "200":
          description: Render versions, newest first
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RenderListResponse"}
        "404": {$ref: "#/components/responses/Error"}
    post:
      tags: [Renders]
      summary: Queue final MP4 rendering
      parameters:
        - {$ref: "#/components/parameters/ProjectId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateRenderRequest"}
      responses:
        "202":
          description: Persisted queued render job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenerationJobResponse"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /chapters/{chapter_id}:
    get:
      tags: [Chapters]
      summary: Get a chapter and ordered scenes
      parameters:
        - {$ref: "#/components/parameters/ChapterId"}
      responses:
        "200":
          description: Chapter
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChapterResponse"}
        "404": {$ref: "#/components/responses/Error"}
  /chapters/{chapter_id}/scenes:
    post:
      tags: [Scenes]
      summary: Add or insert a scene
      parameters:
        - {$ref: "#/components/parameters/ChapterId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateSceneRequest"}
      responses:
        "201":
          description: Scene
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SceneResponse"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /chapters/{chapter_id}/scenes/reorder:
    post:
      tags: [Scenes]
      summary: Reorder every scene in a chapter
      parameters:
        - {$ref: "#/components/parameters/ChapterId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReorderScenesRequest"}
      responses:
        "200":
          description: Updated chapter
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChapterResponse"}
        "409": {$ref: "#/components/responses/Error"}
  /scenes/{scene_id}:
    parameters:
      - {$ref: "#/components/parameters/SceneId"}
    get:
      tags: [Scenes]
      summary: Get a scene
      responses:
        "200":
          description: Scene
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SceneResponse"}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      tags: [Scenes]
      summary: Update editable scene fields
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateSceneRequest"}
      responses:
        "200":
          description: Updated scene
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SceneResponse"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Scenes]
      summary: Delete a scene and normalize positions
      responses:
        "204": {description: Scene deleted}
        "404": {$ref: "#/components/responses/Error"}
  /scenes/{scene_id}/duplicate:
    post:
      tags: [Scenes]
      summary: Duplicate a scene after its source
      parameters:
        - {$ref: "#/components/parameters/SceneId"}
      responses:
        "201":
          description: Draft duplicate
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SceneResponse"}
        "404": {$ref: "#/components/responses/Error"}
  /scenes/{scene_id}/generations:
    post:
      tags: [Scenes]
      summary: Queue real media generation for a persisted scene
      parameters:
        - {$ref: "#/components/parameters/SceneId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateSceneGenerationRequest"}
      responses:
        "202":
          description: Persisted queued generation job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenerationJobResponse"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /scenes/{scene_id}/regenerations:
    post:
      tags: [Scenes]
      summary: Queue a new scene media version
      parameters:
        - {$ref: "#/components/parameters/SceneId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateSceneRegenerationRequest"}
      responses:
        "202":
          description: Persisted queued regeneration job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenerationJobResponse"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /jobs:
    get:
      tags: [Jobs]
      summary: List persisted project jobs
      parameters:
        - {name: project_id, in: query, required: true, schema: {type: string}}
        - {name: active_only, in: query, schema: {type: boolean, default: false}}
      responses:
        "200":
          description: Project jobs, newest first
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenerationJobListResponse"}
        "404": {$ref: "#/components/responses/Error"}
  /jobs/{job_id}:
    get:
      tags: [Jobs]
      summary: Inspect a persisted job
      parameters:
        - {$ref: "#/components/parameters/JobId"}
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenerationJobResponse"}
        "404": {$ref: "#/components/responses/Error"}
  /jobs/{job_id}/cancel:
    post:
      tags: [Jobs]
      summary: Request job cancellation
      parameters:
        - {$ref: "#/components/parameters/JobId"}
      responses:
        "200":
          description: Job marked cancel_requested
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenerationJobResponse"}
        "409": {$ref: "#/components/responses/Error"}
  /jobs/{job_id}/retry:
    post:
      tags: [Jobs]
      summary: Retry failed or cancelled generation work
      description: Creates a new attempt and preserves completed assets and prior job history.
      parameters:
        - {$ref: "#/components/parameters/JobId"}
      responses:
        "200":
          description: New queued retry job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenerationJobResponse"}
        "409": {$ref: "#/components/responses/Error"}
  /assets/{asset_id}:
    get:
      tags: [Assets]
      summary: Get persisted asset metadata
      parameters:
        - {name: asset_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Asset metadata
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssetResponse"}
        "404": {$ref: "#/components/responses/Error"}
  /assets/{asset_id}/preview-url:
    post:
      tags: [Assets]
      summary: Create a short-lived signed B2 preview URL
      parameters:
        - {name: asset_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Signed preview
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SignedPreviewUrlResponse"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /renders/{render_id}:
    get:
      tags: [Renders]
      summary: Get a persisted render
      parameters:
        - {name: render_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Render metadata
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RenderResponse"}
        "404": {$ref: "#/components/responses/Error"}
  /renders/{render_id}/preview-url:
    post:
      tags: [Renders]
      summary: Create a signed final-video preview URL
      parameters:
        - {name: render_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Signed final-video preview
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SignedPreviewUrlResponse"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: talemotion_session
  parameters:
    ProjectId: {name: project_id, in: path, required: true, schema: {type: string}}
    ChapterId: {name: chapter_id, in: path, required: true, schema: {type: string}}
    SceneId: {name: scene_id, in: path, required: true, schema: {type: string}}
    JobId: {name: job_id, in: path, required: true, schema: {type: string}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, minLength: 1, maxLength: 128}
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string}
  responses:
    Error:
      description: Consistent error envelope
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 8, maxLength: 128}
        name: {type: string, minLength: 1, maxLength: 120}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 1, maxLength: 128}
    UserResponse:
      type: object
      required: [id, email, name, created_at, updated_at]
      properties:
        id: {type: string}
        email: {type: string, format: email}
        name: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CsrfTokenResponse:
      type: object
      required: [csrf_token]
      properties:
        csrf_token: {type: string}
    VideoMode:
      type: string
      enum: [historical_documentary, microdrama, product_advertisement]
    ProjectStatus:
      type: string
      enum: [draft, storyboard_pending, storyboard_generating, storyboard_ready, media_generating, rendering, ready, failed, deleted]
    ChapterStatus:
      type: string
      enum: [draft, ready, generating, completed, failed]
    SceneStatus:
      type: string
      enum: [draft, ready, queued, generating, completed, failed]
    JobType:
      type: string
      enum: [storyboard, scene_generation, scene_regeneration, project_generation, render]
    JobStatus:
      type: string
      enum: [queued, running, completed, failed, cancel_requested, cancelled]
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status: {const: ok}
        service: {type: string}
        version: {type: string}
    DependencyHealthResponse:
      type: object
      required: [status, dependencies]
      properties:
        status: {type: string, enum: [ok, unavailable]}
        dependencies:
          type: object
          required: [database, redis]
          properties:
            database: {type: string, enum: [ok, unavailable]}
            redis: {type: string, enum: [ok, unavailable]}
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [mode, topic]
      properties:
        mode: {$ref: "#/components/schemas/VideoMode"}
        title: {type: [string, "null"], minLength: 1, maxLength: 200, description: Optional; a deterministic working title is derived from topic when omitted.}
        topic: {type: string, minLength: 1, maxLength: 4000}
        source_notes: {type: [string, "null"], maxLength: 12000}
        content_type: {type: string, enum: [documentary, educational, explainer], default: documentary}
        tone: {type: string, enum: [cinematic, informative, dramatic, inspirational, neutral], default: cinematic}
        target_audience: {type: string, minLength: 1, maxLength: 200, default: General audience}
        additional_direction: {type: string, default: ""}
        language: {type: string, pattern: '^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$', default: en}
        duration_seconds: {type: integer, enum: [30, 45], default: 45}
        aspect_ratio: {type: string, enum: ["9:16"], default: "9:16"}
        visual_style: {type: string}
        narration_style: {type: string}
        captions_enabled: {type: boolean, default: false}
        narration_enabled: {type: boolean, default: true}
        music_enabled: {type: boolean, default: false}
        historical_accuracy_note: {type: [string, "null"]}
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1}
        topic: {type: string, minLength: 1}
        source_notes: {type: [string, "null"], maxLength: 12000}
        content_type: {type: string, enum: [documentary, educational, explainer]}
        tone: {type: string, enum: [cinematic, informative, dramatic, inspirational, neutral]}
        target_audience: {type: string, minLength: 1, maxLength: 200}
        additional_direction: {type: string}
        language: {type: string}
        duration_seconds: {type: integer, enum: [30, 45]}
        aspect_ratio: {type: string, enum: ["9:16"]}
        visual_style: {type: string}
        narration_style: {type: string}
        captions_enabled: {type: boolean}
        narration_enabled: {type: boolean}
        music_enabled: {type: boolean}
        historical_accuracy_note: {type: [string, "null"]}
    ProjectResponse:
      allOf:
        - {$ref: "#/components/schemas/CreateProjectRequest"}
        - type: object
          required: [id, title, topic, content_type, language, tone, target_audience, status, generation_progress, chapters, created_at, updated_at]
          properties:
            id: {type: string}
            status: {$ref: "#/components/schemas/ProjectStatus"}
            generation_progress: {type: integer, minimum: 0, maximum: 100}
            chapters:
              type: array
              items: {$ref: "#/components/schemas/ChapterResponse"}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    ProjectListResponse:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/ProjectResponse"}}
        next_cursor: {type: [string, "null"]}
        has_more: {type: boolean}
    ChapterResponse:
      type: object
      required: [id, project_id, title, position, status, scenes, created_at, updated_at]
      properties:
        id: {type: string}
        project_id: {type: string}
        title: {type: string}
        summary: {type: [string, "null"]}
        position: {type: integer, minimum: 1}
        target_duration_seconds: {type: [integer, "null"]}
        status: {$ref: "#/components/schemas/ChapterStatus"}
        scenes: {type: array, items: {$ref: "#/components/schemas/SceneResponse"}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CreateSceneRequest:
      type: object
      additionalProperties: false
      required: [title, narration, visual_prompt, duration_seconds]
      properties:
        title: {type: string, minLength: 1}
        narration: {type: string}
        visual_prompt: {type: string}
        duration_seconds: {type: integer, minimum: 1, maximum: 60}
        position: {type: integer, minimum: 1}
    CreateSceneGenerationRequest:
      type: object
      additionalProperties: false
      properties:
        duration_seconds: {type: integer, minimum: 1, maximum: 60, default: 5}
        generate_video: {type: boolean, default: true}
    CreateSceneRegenerationRequest:
      type: object
      additionalProperties: false
      required: [additional_instruction]
      properties:
        additional_instruction: {type: string, minLength: 1, maxLength: 2000}
        duration_seconds: {type: integer, minimum: 1, maximum: 60, default: 5}
        generate_video: {type: boolean, default: true}
    CreateStoryboardRequest:
      type: object
      additionalProperties: false
      properties:
        replace_existing: {type: boolean, default: false}
    CreateProjectGenerationRequest:
      type: object
      additionalProperties: false
      properties:
        generate_video: {type: boolean, default: true}
    CreateRenderRequest:
      type: object
      additionalProperties: false
      properties:
        narration_enabled: {type: [boolean, "null"]}
        captions_enabled: {type: [boolean, "null"]}
        music_enabled: {type: [boolean, "null"]}
    UpdateSceneRequest:
      type: object
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1}
        narration: {type: string}
        visual_prompt: {type: string}
        duration_seconds: {type: integer, minimum: 1, maximum: 60}
    ReorderScenesRequest:
      type: object
